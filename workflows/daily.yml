name: Daily quote tracker

on:
  schedule:
    - cron: "17 9 * * *"   # every day at 09:17 UTC
  workflow_dispatch:        # lets you also run it by hand from the Actions tab

permissions:
  contents: write           # needed so the workflow can commit the new data

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python track_quotes.py
        env:
          WISE_TOKEN: ${{ secrets.WISE_TOKEN }}
      - name: Commit new data
        run: |
          git config user.name "quote-tracker-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily quotes $(date -u +%Y-%m-%d)"
          git push
